name: Test Pyraview

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        shell: bash
        run: |
          mkdir build
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build All
        run: cmake --build build --parallel

      - name: Run C Tests
        shell: bash
        run: |
          cd build
          ctest --output-on-failure

  build-matlab:
    name: Build & Test Matlab (${{ matrix.os }})
    needs: build_and_test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matlab actions support limited OS versions, check availability.
        # macOS is pinned to macos-14 (arm64) because the macos-latest image
        # ships an Xcode too new for R2024b's mex linker.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2024b'

      # MATLAB R2024b's mex linker is incompatible with the very new Xcode on
      # the default image, so select a supported Xcode 15.x.
      - name: Select Xcode for MEX (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          XC=""
          for v in 15.4 15.3 15.2 15.1 15.0.1 15.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XC="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$XC" ]; then
            echo "No Xcode 15.x found on runner; available Xcodes:"; ls -d /Applications/Xcode_*.app || true; exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          clang --version

      # MATLAB's mex needs a C/C++ compiler. The GitHub Windows runner no
      # longer exposes one that mex auto-detects, so locate (or install)
      # MinGW-w64 and advertise it via MW_MINGW64_LOC, which is exactly the
      # environment variable mex looks for.
      - name: Set up MinGW-w64 for MEX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\msys64\mingw64',
            'C:\mingw64',
            'C:\ProgramData\mingw64\mingw64',
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64'
          )
          function Find-MinGW($list) {
            foreach ($c in $list) {
              if (Test-Path (Join-Path $c 'bin\gcc.exe')) { return $c }
            }
            return $null
          }
          $loc = Find-MinGW $candidates
          if (-not $loc) {
            Write-Host 'MinGW-w64 not found in standard locations; installing via Chocolatey...'
            choco install mingw -y --no-progress | Out-Null
            $loc = Find-MinGW $candidates
            if (-not $loc) {
              $found = Get-ChildItem -Path 'C:\ProgramData' -Filter 'gcc.exe' -Recurse -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -match '\\mingw64\\bin\\gcc\.exe$' } |
                       Select-Object -First 1
              if ($found) { $loc = Split-Path (Split-Path $found.FullName) }
            }
          }
          if (-not $loc) { throw 'Could not locate or install MinGW-w64.' }
          Write-Host "Using MW_MINGW64_LOC=$loc"
          & (Join-Path $loc 'bin\gcc.exe') --version
          "MW_MINGW64_LOC=$loc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile MEX
        uses: matlab-actions/run-command@v2
        with:
          # Run the updated build script which handles paths correctly
          command: cd('src/matlab'); build_pyraview;

      - name: Run Matlab Tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('src/matlab');
            addpath('src/matlab/tests');
            results = runtests('pyraview.unittest.TestDataset');
            assert(~any([results.Failed]));
