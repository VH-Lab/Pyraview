name: Release Pyraview

on:
  # Publishing a release through the UI also creates its tag, so a
  # `push: tags` trigger here would start a second, identical run that races
  # this one to upload the same assets. The release event is the single
  # trigger; push a tag and then publish a release for it, or use the manual
  # dispatch below.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

# Belt and braces: if a manual dispatch overlaps a release run for the same
# tag, queue the second rather than let both write assets at once.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build_and_test:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        shell: bash
        run: |
          mkdir build
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build All
        run: cmake --build build --parallel

      # Zip binaries for release (naming by OS/Architecture)
      - name: Package Binaries
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Use 7-Zip (pre-installed on Windows runners)
            # 'a' is add, '-j' junk paths (like zip -j)
            7z a -tzip dist/pyraview-win-x64.zip ./build/bin/*.dll ./build/bin/*.exe
          else
            zip -j dist/pyraview-${{ runner.os }}-${{ runner.arch }}.zip build/bin/*
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*

  build_wheels:
    name: Build Python wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Any label added here must actually schedule. The release job waits on
        # this one, so a label with no runner behind it (as macos-13 became
        # after that image was retired) sits queued forever and no assets ever
        # attach to the release. test.yml runs the Python suite on
        # ubuntu-24.04-arm for the same reason: to prove the arm64 label works
        # on every PR, not first at release time.
        #
        # macOS wheels are arm64 only; Intel Macs install from the sdist, which
        # builds the library during the install.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # cibuildwheel drives the CMake build once per target interpreter, so each
      # wheel carries its own copy of the library and needs no compiler or
      # PYRAVIEW_LIB on the installing machine. Configured in pyproject.toml.
      - name: Build Wheels
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # A release whose assets carry a different version than its tag is confusing
  # to anyone installing from it, so check before the wheels are attached.
  check_version:
    name: Check Version Matches Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compare pyproject.toml Version With Tag
        shell: bash
        run: |
          set -e
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "Not a version tag ($TAG); nothing to compare."; exit 0 ;;
          esac
          TAG_VERSION="${TAG#v}"
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $TAG implies version $TAG_VERSION, but pyproject.toml declares $PROJECT_VERSION."
            echo "Bump the version in pyproject.toml to match the release tag."
            exit 1
          fi
          echo "Releasing version $PROJECT_VERSION"

  build_sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-matlab:
    name: Build Matlab MEX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matlab actions support limited OS versions, check availability.
        # macOS is pinned to macos-14 (arm64) because the macos-latest image
        # ships an Xcode too new for R2024b's mex linker.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2024b'

      # MATLAB R2024b's mex linker is incompatible with the very new Xcode on
      # the default image, so select a supported Xcode 15.x.
      - name: Select Xcode for MEX (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          XC=""
          for v in 15.4 15.3 15.2 15.1 15.0.1 15.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XC="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$XC" ]; then
            echo "No Xcode 15.x found on runner; available Xcodes:"; ls -d /Applications/Xcode_*.app || true; exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          clang --version

      # MATLAB's mex needs a C/C++ compiler. The GitHub Windows runner no
      # longer exposes one that mex auto-detects, so locate (or install)
      # MinGW-w64 and advertise it via MW_MINGW64_LOC, which is exactly the
      # environment variable mex looks for.
      - name: Set up MinGW-w64 for MEX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\msys64\mingw64',
            'C:\mingw64',
            'C:\ProgramData\mingw64\mingw64',
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64'
          )
          function Find-MinGW($list) {
            foreach ($c in $list) {
              if (Test-Path (Join-Path $c 'bin\gcc.exe')) { return $c }
            }
            return $null
          }
          $loc = Find-MinGW $candidates
          if (-not $loc) {
            Write-Host 'MinGW-w64 not found in standard locations; installing via Chocolatey...'
            choco install mingw -y --no-progress | Out-Null
            $loc = Find-MinGW $candidates
            if (-not $loc) {
              $found = Get-ChildItem -Path 'C:\ProgramData' -Filter 'gcc.exe' -Recurse -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -match '\\mingw64\\bin\\gcc\.exe$' } |
                       Select-Object -First 1
              if ($found) { $loc = Split-Path (Split-Path $found.FullName) }
            }
          }
          if (-not $loc) { throw 'Could not locate or install MinGW-w64.' }
          Write-Host "Using MW_MINGW64_LOC=$loc"
          & (Join-Path $loc 'bin\gcc.exe') --version
          "MW_MINGW64_LOC=$loc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile MEX
        uses: matlab-actions/run-command@v2
        with:
          # Run the updated build script which handles paths correctly
          command: cd('src/matlab'); build_pyraview;

      - name: Upload MEX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mex-${{ matrix.os }}
          path: src/matlab/+pyraview/*.mex* # Capture all MEX files in the package
          if-no-files-found: error

  package-matlab:
    name: Package Matlab Toolbox
    needs: build-matlab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: 'R2024b'

      # Download all platform-specific MEX files we just built
      - name: Download all MEX artifacts
        uses: actions/download-artifact@v4
        with:
          path: src/matlab/+pyraview
          pattern: mex-*
          merge-multiple: true

      # Run the packaging command
      - name: Package Toolbox
        uses: matlab-actions/run-command@v2
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        with:
          command: |
            % 1. Define metadata
            toolboxName = 'Pyraview';
            % Use the fixed GUID we agreed upon
            guid = '6e14a2b9-7f3c-4d8e-9a1b-3c5d7e9f2a4b';

            % 2. Get Version from Environment
            version = getenv('GITHUB_REF_NAME');
            if isempty(version) || ~startsWith(version, 'v')
                version = '0.1.6'; % Fallback
            else
                version = erase(version, 'v');
            end

            % 3. Initialize Options from the MATLAB source folder
            % This creates the object without needing a .prj file on disk yet
            opts = matlab.addons.toolbox.ToolboxOptions(fullfile(pwd, 'src', 'matlab'), guid, ...
                'ToolboxName', toolboxName, ...
                'ToolboxVersion', version, ...
                'AuthorName', 'Van Hooser lab', ...
                'AuthorEmail', 'vanhoosr@brandeis.edu', ...
                'Description', 'High-performance multi-resolution decimation engine.', ...
                'OutputFile', fullfile(pwd, 'Pyraview.mltbx'), ...
                'ToolboxFiles', {fullfile(pwd, 'src', 'matlab')});

            % 6. Package it
            fprintf('Packaging %s v%s [%s]...\n', toolboxName, version, guid);
            matlab.addons.toolbox.packageToolbox(opts);

      # Upload the .mltbx as an artifact so the release job can pick it up
      - name: Upload Toolbox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: matlab-toolbox
          path: Pyraview.mltbx

  release:
    name: Create GitHub Release
    needs: [build_and_test, package-matlab, build_wheels, build_sdist, check_version]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          name: Release ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
