name: macOS Wheels

# Builds and tests the macOS wheels exactly as release.yml does, so the x86_64
# wheels (cross-compiled on the arm64 runner and tested under Rosetta 2) are
# proven on the PR that changes how they are built, not first at release time.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/c/**'
      - 'src/python/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/wheels.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/check_macos_wheel_arch.sh'
  workflow_dispatch:

jobs:
  build_macos_wheels:
    name: Build & Test macOS Wheels (x86_64 + arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Wheels
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Check macOS Wheel Architectures
        run: .github/scripts/check_macos_wheel_arch.sh wheelhouse

      - name: List Wheels
        run: ls -1 wheelhouse

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl
          if-no-files-found: error
